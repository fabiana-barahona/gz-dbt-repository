version: 2
sources:
  - name: raw # Logical name for the source group
    schema: gwz_raw_data # Exact BigQuery Dataset ID
    description: greenwez raw data source
    
    tables:
      # --- SALES TABLE ---
      - name: sales
        identifier: raw_gz_sales # Exact table name in BQ
        description: sales of greewneez / we have one row per product_id found in each order_id
        
        # ✅ FIX 1: Must be a literal column name for the freshness check.
        loaded_at_field: date_date 
        freshness: 
          warn_after:
            count: 90
            period: day
            
        columns:
          # ✅ FIX 2: Cannot define a composite key using an expression in sources YAML. Testing on components is correct.
          - name: orders_id
            tests:
              - not_null
          - name: products_id
            tests:
              - not_null
              
      # --- PRODUCT TABLE ---
      - name: product
        identifier: raw_gz_product
        description: purchase_price by products_id
        columns:
          - name: products_id
            description: primary key of the table
            tests:
              - unique
              - not_null
              
      # --- SHIP TABLE ---
      - name: ship
        identifier: raw_gz_ship
        description: ship
        columns:
          - name: orders_id
            description: primary key of the table
            tests:
              - unique
              - not_null

      # --- MARKETING TABLES ---

      - name: adwords
        identifier: raw_gz_adwords
        description: adwords performance


      - name: bing
        identifier: raw_gz_bing
        description: biing performance

      - name: criteo
        identifier: raw_gz_criteo
        description: criteo performance
      - name: facebook
        identifier: raw_gz_facebook
        description: facebook performance

      - name: int_campaigns
        identifier: int_campaigns
        description: try of primary key 
        columns:
          - name: "(date_date || '-' || campaign_name||'-'|| campaign_key)"
            tests:
            - unique
              - not_null